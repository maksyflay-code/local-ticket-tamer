map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  # DNS interno do Docker: resolve os destinos em tempo de execucao,
  # assim o gateway sobe mesmo que algum servico ainda nao esteja de pe.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location ~ ^/(auth|rest|realtime|storage)/v1/ {
    set $upstream_kong http://kong:8000;
    proxy_pass $upstream_kong$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  location / {
    set $upstream_app http://app:3000;
    proxy_pass $upstream_app$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
